<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agent Walk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap">
<style>
/* One agent, one task, two views in step: where it went (the floor plan) and what it wrote (the transcript, with every removable span highlighted). Built by llmaj/walkthrough/build.py from a labeled.jsonl; the data is embedded as <script id=data>. */
:root{
  --bg:#F2F4F0; --fg:#1A1E1B; --muted:#5C645E; --rule:#D5D9D3; --tile:#FAFBF9;
  --paper:#FAFBF9; --wall:#2A2F2B; --wing:#EEF1EC; --room:#FFFFFF; --room-fix:#E7EEF7;
  --waste:#B9382B; --dup:#D9714E; --stuck:#8A2419; --pad:#C98A3A;
  --agent:#2F8F5B; --think:#5E5BB0; --car-a:#2F8F5B; --car-b:#B9382B;
  --m-detour:#F3D3CF; --m-dup:#F8DCCB; --m-restated:#EFC9C4; --m-padding:#F6E3C2;
  --f0:#DCE7F5; --f1:#F8E7D4; --f2:#DFF0E4; --f3:#EDE3F5; --f4:#F6E3E3; --f5:#E2EEF0; --f6:#F3EFD9; --f7:#E9E9E9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181A; --fg:#E8EAE6; --muted:#9AA29C; --rule:#2E3335; --tile:#1C2022; --paper:#1C2022; --wall:#C9CFC9; --wing:#23282A; --room:#2B3133; --room-fix:#28364A;
  --waste:#E06A58; --dup:#F0956F; --stuck:#F2847A; --pad:#E0A85C; --agent:#4FB07A; --think:#9B98E6; --car-a:#4FB07A; --car-b:#E06A58;
  --m-detour:#4A2622; --m-dup:#4A2E20; --m-restated:#46201C; --m-padding:#4A3A1E;
  --f0:#263447; --f1:#473826; --f2:#264331; --f3:#3A2F47; --f4:#472B2B; --f5:#26393D; --f6:#45402A; --f7:#303434; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181A; --fg:#E8EAE6; --muted:#9AA29C; --rule:#2E3335; --tile:#1C2022; --paper:#1C2022; --wall:#C9CFC9; --wing:#23282A; --room:#2B3133; --room-fix:#28364A;
  --waste:#E06A58; --dup:#F0956F; --stuck:#F2847A; --pad:#E0A85C; --agent:#4FB07A; --think:#9B98E6; --car-a:#4FB07A; --car-b:#E06A58;
  --m-detour:#4A2622; --m-dup:#4A2E20; --m-restated:#46201C; --m-padding:#4A3A1E;
  --f0:#263447; --f1:#473826; --f2:#264331; --f3:#3A2F47; --f4:#472B2B; --f5:#26393D; --f6:#45402A; --f7:#303434; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);margin:0}
.wrap{max-width:1500px;margin:0 auto;padding-block:22px 28px;padding-inline:16px}
h1{font-size:1.5rem;font-weight:500;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem;max-width:80ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
.controls select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--tile);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;max-width:100%}
.controls button{font:inherit;font-size:.9rem;padding:7px 14px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
.controls button:focus-visible,.controls select:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;border-top:1px solid var(--rule);padding-top:12px;margin-bottom:10px}
.name{font-size:1.15rem;font-weight:500;display:flex;align-items:center;gap:8px}
.name .sw{width:12px;height:12px;border-radius:50%;background:var(--agent);display:inline-block}
.chip{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rule);border-radius:4px;padding:2px 6px;color:var(--muted)}
.stats{margin-left:auto;display:flex;gap:18px;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.stage{display:grid;grid-template-columns:minmax(0,27fr) minmax(0,47fr) minmax(0,26fr);gap:14px;height:720px;min-height:0}
@media (max-width:1000px){.stage{grid-template-columns:1fr;height:auto}.feed{height:520px}.col>.panel{flex:none}.panel svg{height:auto}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.col>.panel{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.col>.plan-panel{flex:11 1 0}.col>.flow{flex:9 1 0}
#planBox{flex:1;min-height:0;display:flex}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px;min-width:0;padding:10px 12px 8px}
.panel h2{font-size:.84rem;font-weight:600;letter-spacing:.01em;color:var(--fg);margin:0 0 6px;display:flex;gap:10px;align-items:baseline}
.panel h2 small{font-weight:400;letter-spacing:0;text-transform:none;font-size:.74rem}
.panel svg{width:100%;height:100%;flex:1;min-height:0;display:block}
.plan{border:0;border-radius:4px}
.plan{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.plan text{font-family:var(--mono);fill:var(--fg)}
.plan .wingl{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--fg);letter-spacing:.02em}
.plan .ico{font-family:"Material Symbols Outlined";font-size:20px;fill:var(--fg);opacity:.5;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 20}
.plan .wsub{font-family:var(--sans);font-size:9.5px;fill:var(--muted)}
.plan .rooml{font-size:10px}
.plan .trail,.plan .stalls{filter:url(#pglow)}
.plan .callout rect{fill:var(--tile);stroke:var(--k);stroke-width:1.2}
.plan .callout text{font-family:var(--sans);font-size:9.5px}
.plan .callout .kt{font-family:var(--mono);font-weight:600;fill:var(--k);text-transform:uppercase;letter-spacing:.05em;font-size:8.5px}
.plan .wingl{font-size:16px}.plan .wsub{font-size:13px}.plan .rooml{font-size:13px}.plan .ico{font-size:26px} /* after the floor plan’s own rules, so these win */
.flow text{font-family:var(--sans);fill:var(--fg)}
.flow .nm{font-size:19px;font-weight:600;letter-spacing:.02em}
.flow .df{font-size:16px;fill:var(--muted)}
.flow .ct{font-family:var(--mono);font-size:15px;fill:var(--muted)}
.flow .ico{font-family:"Material Symbols Outlined";font-size:28px;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 20}
.flow .mk{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chart svg text{font-family:var(--mono);font-size:15px;fill:var(--muted)}
.chart svg .lbl{font-family:var(--sans);font-size:15px;fill:var(--fg)}
.chart svg .grid{stroke:var(--rule);stroke-width:1}
.feed{background:var(--paper);border:1px solid var(--rule);border-radius:6px;overflow:hidden;position:relative;min-width:0;min-height:0}
.feed h2{position:absolute;z-index:1;left:0;right:0;top:0;margin:0;background:var(--paper);padding:10px 12px 6px;font-size:.84rem;font-weight:600;letter-spacing:.01em;color:var(--fg);border-bottom:1px solid var(--rule)}
.feed .roll{position:absolute;left:0;right:0;top:0;padding:42px 14px 400px;will-change:transform}
.feed:after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--paper));pointer-events:none}
.rd{border:1px solid var(--rule);border-radius:8px;background:var(--tile);margin-bottom:22px;padding:8px 12px 6px;display:none;height:var(--card,300px);box-sizing:border-box;overflow:hidden;position:relative}
.rd:after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(transparent,var(--tile));pointer-events:none}
.rd.on{display:block}
.rd{--cardbg:var(--tile);background:var(--cardbg);transition:border-color .25s,box-shadow .25s,opacity .35s,background .25s}
.rd:after{background:linear-gradient(transparent,var(--cardbg))}
.rd.on:not(.cur){opacity:.45}
.rd.cur{--hi:var(--agent);--cardbg:color-mix(in srgb,var(--agent) 7%,var(--tile));opacity:1;border-color:var(--hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--hi) 35%,transparent),0 12px 34px color-mix(in srgb,var(--hi) 32%,transparent)}
.rd.cur.th{--hi:var(--think);--cardbg:color-mix(in srgb,var(--think) 8%,var(--tile))}
.rd.cur:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--hi);border-radius:8px 0 0 8px}
.blk.on{animation:blkIn .35s ease-out}
@keyframes blkIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.blk.on mark{animation:markIn .7s ease-out}
@keyframes markIn{0%{box-shadow:0 0 0 0 var(--k)}55%{box-shadow:0 0 0 5px color-mix(in srgb,var(--k) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.flow .edges{filter:url(#fglow)}
.flow .edges path.live{stroke-opacity:1;stroke-dasharray:10 7}
.flow .node.cur>rect:first-child{stroke-width:3.5;filter:url(#fglow)}
.flow .node.cur>rect:first-child{fill:color-mix(in srgb,var(--agent) 12%,var(--wing))}
.flow .node.cur.th>rect:first-child{fill:color-mix(in srgb,var(--think) 12%,var(--wing))}
.rd header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:4px}
.rd .n{font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.wk{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;font-weight:600;text-transform:uppercase;padding:0 6px;border-radius:3px;color:var(--k);border:1.5px solid var(--k);background:var(--m);white-space:nowrap}
.rd header .wk{font-size:.66rem}
.blk h4 .wk{font-weight:600;letter-spacing:.05em}
.st{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;font-weight:600;padding:1px 7px;border-radius:3px;color:#fff;background:var(--s)}
.rd .tok{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rd .tok b{color:var(--waste);font-weight:500}
.blk{display:none;border-top:1px dashed var(--rule);padding:6px 0 4px}
.blk.on{display:block}
.blk h4{margin:0 0 3px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.blk h4 .ico{font-family:"Material Symbols Outlined";font-size:15px;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 20}
.blk p,.blk pre{margin:0;font-size:.86rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.blk pre{font-family:var(--mono);font-size:.76rem;line-height:1.4}
.think p{color:var(--fg);font-style:italic}
.think h4{color:var(--think)}
.res pre{color:var(--muted);font-size:.72rem}
mark{background:var(--m);color:var(--fg);border-radius:2px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:2px solid var(--k)}
mark .tag{font-family:var(--mono);font-style:normal;font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--k);margin-left:4px;vertical-align:1px;white-space:nowrap}
.note{margin:4px 0 0;font-size:.74rem;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.note b{color:var(--k);font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:9px;border-radius:2px;background:var(--m);border-bottom:2px solid var(--k)}
.legend i.bot{width:12px;height:12px;border-radius:50%;background:var(--agent);border:0}
.legend i.th{width:12px;height:12px;border-radius:50%;background:transparent;border:2px dashed var(--think)}
.legend i.ring{width:10px;height:10px;border:2.5px solid var(--l);border-radius:50%;background:transparent}
.legend i.ring.dash{border-style:dashed}
.legend i.box{width:14px;height:10px;border:1.5px solid var(--agent);border-radius:2px;background:var(--room-fix)}
.cap{font-size:1rem;margin:12px 0 0;color:var(--muted)}

/* A post column (700-1000px): the three columns of the full view, tighter. Below 700px: one column,
   every panel with a height of its own, the three charts side by side. */
@media (min-width:700px) and (max-width:1000px){
 .stage{grid-template-columns:minmax(0,30fr) minmax(0,44fr) minmax(0,26fr);gap:8px;height:720px;min-height:0}
 .feed{height:auto}
 .col>.panel{flex:1 1 0}
 .panel{padding:8px 8px 6px}
 .panel h2{font-size:.76rem}
 .panel svg{height:100%}
 .plan{height:100%;max-height:100%}
 .head{gap:6px 12px}.name{font-size:1rem}.stats{gap:10px;font-size:.7rem}
 .rd{padding:6px 8px 4px}.rd header{gap:4px 8px}
 .blk p{font-size:.78rem}.blk pre{font-size:.68rem}.rd .n,.rd .tok{font-size:.66rem}
 .legend{font-size:.74rem;gap:4px 10px}
}
@media (max-width:699px){
 .stage{grid-template-columns:1fr;height:auto;min-height:0}
 .feed{height:520px}
 .col{min-height:0}
 .col:nth-child(2)>.plan-panel{flex:none;height:440px}
 .col:nth-child(2)>.flow{flex:none;height:400px}
 .col:last-child{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 .col:last-child>.chart{flex:none;height:230px}
 .panel svg{height:100%}
 .plan{height:100%;max-height:100%}
}
</style>
<div class="wrap">
  <div class="controls">
    <label>Trajectory <select id="sel"></select></label>
    <button type="button" id="replay">Replay</button>
  </div>
  <div class="head" id="head" hidden></div>
  <div class="stage">
    <div class="feed"><h2>Trajectory Viewer</h2><div class="roll" id="roll"></div></div>
    <div class="col">
      <div class="panel plan-panel"><h2>Workflow <small id="planSub"></small></h2><div id="planBox"></div></div>
      <svg id="flow" viewBox="0 0 780 440" hidden aria-hidden="true"></svg>
    </div>
    <div class="col">
      <div class="panel chart"><h2>tokens written</h2><svg id="curveTok" viewBox="0 0 560 330" role="img" aria-label="tokens written by turn"></svg></div>
      <div class="panel chart"><h2>removable tokens</h2><svg id="curveWaste" viewBox="0 0 560 330" role="img" aria-label="removable tokens by turn"></svg></div>
      <div class="panel chart"><h2>waste ratio</h2><svg id="curveRatio" viewBox="0 0 560 330" role="img" aria-label="removable share by turn"></svg></div>
    </div>
  </div>
  <div class="legend">
    <span><i class="bot"></i>the turn’s reply + tool calls</span>
    <span><i class="th"></i>the turn’s reasoning</span>
    <span id="lgfix"><i class="box"></i>patched</span>
    <span><i class="ring" style="--l:var(--waste)"></i>detour (more than 50% of the tokens are waste)</span>
    <span><i class="ring dash" style="--l:var(--dup)"></i>repeat fetch</span>
    <span><i class="ring" style="--l:var(--stuck)"></i>restated</span>
    <span><i class="ring" style="--l:var(--pad)"></i>padding</span>
  </div>
  <p class="cap" id="cap" hidden></p>
</div>
<script>
let DATA=[]; let BENCH_KEY="swe_verified"; let CFG=null;
const BENCH={
  "swe_verified":{label:"swe_verified",plan:"the repository: one block per folder",top:{name:"issue",label:"issue",sub:"the PR description, where every run starts"},bottom:[{key:"term",label:"terminal",sub:"tests, scripts, git"},{key:"exit",label:"submit",sub:"the patch leaves the repository"}],fixLegend:"the folder this agent patched",noun:["file","files"],taskLabel:id=>id},
  "tau2-retail":{label:"tau2 retail",plan:"the service counter: one desk per tool",layout:"counter",top:{name:"customer",label:"customer",sub:"waiting at the counter"},bottom:[],fixLegend:"",noun:["record","records"],taskLabel:id=>"task "+id},
  "tau2-airline":{label:"tau2 airline",plan:"the service counter: one desk per tool",layout:"counter",top:{name:"customer",label:"passenger",sub:"waiting at the counter"},bottom:[],fixLegend:"",noun:["record","records"],taskLabel:id=>"task "+id},
  "mcp_atlas":{label:"mcp_atlas",plan:"the toolbox: one block per MCP server",top:{name:"question",label:"question",sub:"the task, where every run starts"},bottom:[{key:"term",label:"notes",sub:"text between tool calls"},{key:"exit",label:"answer",sub:"the final reply"}],fixLegend:"",noun:["distinct call","distinct calls"],taskLabel:id=>"task "+id.slice(0,8)},
  "claw_eval":{label:"claw_eval",plan:"the office: one block per app",top:{name:"question",label:"brief",sub:"the task, where every run starts"},bottom:[{key:"term",label:"notes",sub:"text between tool calls"},{key:"exit",label:"deliverable",sub:"the final reply"}],fixLegend:"",noun:["distinct call","distinct calls"],taskLabel:id=>"task "+id},
};
const STATES=["FRAME","PLAN","RETRIEVE","INTERPRET","DERIVE","MUTATE","VERIFY","RECOVER"];
const COL={FRAME:"#446380",PLAN:"#5E93AE",RETRIEVE:"#6FA0B8",INTERPRET:"#6B8FA8",DERIVE:"#8093AD",MUTATE:"#FE5E1C",VERIFY:"#E09A2E",RECOVER:"#B8410A"};
const ICON={FRAME:"center_focus_strong",PLAN:"checklist",RETRIEVE:"search",INTERPRET:"manage_search",DERIVE:"functions",MUTATE:"edit",VERIFY:"fact_check",RECOVER:"healing"};
const DEF={FRAME:"what is being asked",PLAN:"order and route",RETRIEVE:"read the environment",INTERPRET:"make sense of a result",DERIVE:"reason from the known",MUTATE:"compose the deliverable",VERIFY:"check an expectation",RECOVER:"react to a failure"};
const KIND={detour:["var(--m-detour)","var(--waste)","detour"],unread:["var(--m-detour)","var(--waste)","detour"],"duplicate-fetch":["var(--m-dup)","var(--dup)","repeat fetch"],restated:["var(--m-restated)","var(--stuck)","restated"],padding:["var(--m-padding)","var(--pad)","padding"]};
const KIND_COLOR={detour:"var(--waste)",unread:"var(--waste)","duplicate-fetch":"var(--dup)",restated:"var(--stuck)",padding:"var(--pad)"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("en-US");
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const sel=$("sel");
function taskLabel(t){return (BENCH[t.bench]||BENCH.swe_verified).taskLabel(t.task);}
async function load(){
  const inl=document.getElementById("data");
  if(inl){DATA=JSON.parse(inl.textContent);}
  else{try{const r=await fetch("merged.json");DATA=await r.json();}catch(e){$("cap").hidden=false;$("cap").textContent="Could not load merged.json";return;}}
  DATA.forEach((t,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${(BENCH[t.bench]||{}).label||t.bench} · ${taskLabel(t)} · ${t.short}${t.effort?" "+t.effort:""}`;sel.appendChild(o);});
}
sel.addEventListener("change",start);$("replay").addEventListener("click",start);

// ---- the building -----------------------------------------------------
const NOISE=/^(re\.c|os\.p|sys\.p|self\.|np\.|pd\.)|^[\w]+\.(c|h|js)$/;
function roomsOf(trajs){
  // files either agent referenced, with directories kept as halls; order of first visit
  const count=new Map(), order=[];
  trajs.forEach(t=>t.rounds.forEach(r=>r.files.forEach(f=>{
    if(NOISE.test(f))return;
    if(!f.includes("/")&&!/\.(py|rst|txt|cfg|toml|ini|html|js|c|h|yml|yaml|json|md|tex)$/.test(f))return;
    if(!count.has(f)){count.set(f,0);order.push(f);}count.set(f,count.get(f)+1);
  })));
  return order.filter(f=>f.includes("/")||count.get(f)>=2||/\.(py|rst)$/.test(f)).filter(f=>!["notes","answer",CFG.top.name].includes(wingOf(f)));
}
function wingOf(f){if(f.startsWith("tmp/"))return "scratch";const i=f.indexOf("/");return i<0?"repo root":f.slice(0,i);}
function fixOf(t,rooms){

    s+=`<g class="node" data-s="${st}" transform="translate(${x-NW/2} ${y-NH/2})"><rect width="${NW}" height="${NH}" rx="8" fill="var(--wing)" stroke="${COL[st]}" stroke-width="1.5"/>`+
       `<rect class="wbar" x="1" y="${NH-4}" width="0" height="3" rx="1" fill="var(--waste)"/>`+
       `<text class="ico" x="9" y="37" fill="${COL[st]}">${ICON[st]}</text><text class="nm" x="46" y="29">${st}</text><text class="df" x="46" y="49">${DEF[st]}</text><text class="ct" x="46" y="67"></text>`+
       `<rect class="hl" width="${NW}" height="${NH}" rx="8" fill="none" stroke="var(--agent)" stroke-width="0" x="0" y="0"/>`+

}
const ROBOT=`<line x1="0" y1="-13" x2="0" y2="-9" stroke="var(--agent)" stroke-width="1.5"/><circle cx="0" cy="-14" r="1.8" fill="var(--agent)"/><rect x="-8" y="-9" width="16" height="11" rx="3" fill="var(--agent)"/><rect x="-5" y="-6" width="3.2" height="3.2" rx=".6" fill="var(--bg)"/><rect x="1.8" y="-6" width="3.2" height="3.2" rx=".6" fill="var(--bg)"/><rect x="-3" y="-1.5" width="6" height="1.2" rx=".6" fill="var(--bg)"/><rect x="-6" y="3" width="12" height="7" rx="2" fill="var(--agent)"/><rect x="-10" y="4" width="3" height="4" rx="1" fill="var(--agent)"/><rect x="7" y="4" width="3" height="4" rx="1" fill="var(--agent)"/>`;
// Orthogonal routes on a lattice of box centres and the corridors between them: a walk never cuts a corner or crosses another box.
const XS=[10,GX[0],265,GX[1],515,GX[2],770], YS=[12,GY[0],134.5,GY[1],275.5,GY[2],405];
const CELL={}; STATES.forEach(st=>{CELL[st]=[XS.indexOf(POS[st][0]),YS.indexOf(POS[st][1])];});
const START_CELL=[1,3]; // the empty left-middle slot, where the robot waits before its first turn
function gridRoute(sa,sb,skip){ // cheapest lattice path from cell sa to cell sb; a turn costs three steps, other boxes are walls

  while(open.length){
    open.sort((u,v)=>u.c-v.c); const n=open.shift(); const k=`${n.x},${n.y},${n.d}`;
    if(best.has(k))continue; best.set(k,n);

      return pts.filter((pt,i)=>!i||i===pts.length-1||!((pts[i-1][0]===pt[0]&&pts[i+1][0]===pt[0])||(pts[i-1][1]===pt[1]&&pts[i+1][1]===pt[1])));}

function edgePath(a,b){
  const [ax,ay]=POS[a];

  const pts=gridRoute(CELL[a],CELL[b],[a,b]);

const ease=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;

// ---- the walk: one timeline drives all three views ------------------------
let raf=null;
const T_THINK=500,T_ACT=550,T_RES=250,T_READ=10;
function start(){
  if(raf){cancelAnimationFrame(raf);raf=null;}
  window.__done=false; const t=DATA[+sel.value]; if(!t)return;
  BENCH_KEY=t.bench; CFG=BENCH[t.bench]||BENCH.swe_verified;
  const rounds=t.rounds.map((rd,i)=>Object.assign({},rd,{res:(t.rounds[i+1]||{}).obs_role==="tool"?(t.rounds[i+1]||{}).obs:""}));
  const solved=t.score==null?"not graded":t.score>=1?"solved":"failed";
  $("head").innerHTML=`<div class="name"><span class="sw"></span>${esc(t.short)}</div>${t.effort?`<span class="chip">${esc(t.effort)} effort</span>`:""}<span class="chip">${esc(CFG.label)}</span><span class="chip" style="text-transform:none">${esc(taskLabel(t))}</span><span class="chip">${solved}</span>`+
    `<div class="stats"><span>turn <b id="sTurn">0</b>/${rounds.length}</span><span>written <b id="sTok">0</b></span><span>removable <b id="sW">0</b></span><span>waste ratio <b id="sR">0%</b></span></div>`;

  $("planBox").innerHTML=planSVG(L,rooms,fix,"var(--agent)");
  const plan=$("planBox").querySelector("svg"), trail=plan.querySelector(".trail"), stalls=plan.querySelector(".stalls"), bot=plan.querySelector(".agent");
  let at=L.issue; const rings=new Map();
  rounds.forEach((rd,i)=>{const tgt=targetOf(L,rd,rooms); const wasteful=rd.b&&rd.w/rd.b>=0.5&&rd.top; rd.kind=wasteful?rd.top.kind:null; rd.col=rd.kind?KIND_COLOR[rd.kind]:"var(--agent)";
    rd.move=!!(tgt&&tgt!==at); rd.pts=rd.move?route(L,at,tgt,i):null; rd.from=at; rd.to=rd.move?tgt:at; if(rd.move)at=tgt;});
  bot.setAttribute("transform",`translate(${ctr(L.issue).join(" ")})`);
  // the workflow and the transcript
  const svg=$("flow"); svg.innerHTML=flowSVG();
  const roll=$("roll"); roll.innerHTML=rounds.map(cardHTML).join(""); roll.style.transform="translateY(0px)";
  const edges=svg.querySelector(".edges"), agent=svg.querySelector(".agent"), think=svg.querySelector(".think");
  const node=s=>svg.querySelector(`.node[data-s="${s}"]`);
  const bpulse=el("circle",{class:"pulse",r:0,fill:"var(--agent)",opacity:0}); bot.insertBefore(bpulse,bot.firstChild); const fpulse=agent.querySelector(".pulse");
  const visits={},bil={},was={},edgeN={};
  // the curves
  let cb=0,cw=0; const tokS=[],wS=[],rS=[]; rounds.forEach(rd=>{cb+=rd.b;cw+=rd.w;tokS.push(cb);wS.push(cw);rS.push(cb?cw/cb:0);});
  const chTok=chartSetup("curveTok","tokens written so far",rounds.length,Math.max(cb,1)), chW=chartSetup("curveWaste","removable tokens so far",rounds.length,Math.max(cw,1)), chR=chartSetup("curveRatio","removable share so far",rounds.length,1,{pct:true});
  chW.svg.querySelector('.ln[data-i="0"]').setAttribute("stroke","var(--waste)");
  const phases=[]; let prev=null,prevT=null; cb=0;cw=0;
  rounds.forEach((rd,i)=>{
    cb+=rd.b;cw+=rd.w; const card=$("rd"+i); const blocks=[...card.querySelectorAll(".blk")];
    const chars=(rd.reasoning.length+rd.text.length)/10;
    if(rd.reasoning.trim())phases.push({i,kind:"think",rd,from:prevT,to:rd.tstate,dur:T_THINK+Math.min(300,chars*T_READ),blk:blocks.find(b=>b.classList.contains("think"))});
    phases.push({i,kind:"act",rd,from:prev,to:rd.state,dur:T_ACT+Math.min(200,chars*T_READ*0.5),blk:blocks.filter(b=>!b.classList.contains("think")&&!b.classList.contains("res")),cb,cw});
    if(rd.res&&rd.res.trim())phases.push({i,kind:"res",rd,dur:T_RES,blk:blocks.find(b=>b.classList.contains("res"))}); // a blank tool result has no block to reveal
    if(rd.state)prev=rd.state; if(rd.tstate)prevT=rd.tstate;

  let k=0,ph=null,pStart=0,y=0,yTarget=0,last=null;
  const place=(g,p)=>g.setAttribute("transform",`translate(${p[0].toFixed(1)} ${p[1].toFixed(1)})`);
  place(agent,[GX[0],GY[1]]); think.setAttribute("opacity","0");
  const feedH=()=>roll.parentElement.getBoundingClientRect().height;
  roll.style.setProperty("--card",Math.floor((feedH()-42)/2-22)+"px");
  const scrollTo=(card,blk)=>{yTarget=Math.max(0,card.offsetTop-42-card.offsetHeight-22);}; // the previous turn stays in view above the current one
  const begin=(p,now)=>{
    pStart=now; const card=$("rd"+p.i); card.classList.add("on"); roll.querySelectorAll(".rd.cur").forEach(c=>c.classList.remove("cur","th")); card.classList.add("cur"); card.classList.toggle("th",p.kind==="think");
    if(p.kind==="think"){p.blk.classList.add("on");scrollTo(card,p.blk);
      if(p.to){think.setAttribute("opacity","1");p.path=p.from&&p.from!==p.to?{pts:gridRoute(CELL[p.from],CELL[p.to],[p.from,p.to])}:null;
        svg.querySelectorAll(".hl2").forEach(h=>h.setAttribute("stroke-width","0"));}
    }
    if(p.kind==="act"){p.blk.forEach(b=>b.classList.add("on"));scrollTo(card,p.blk[p.blk.length-1]);
      if(p.to){const from=p.from;
        if(from){const key=from+">"+p.to;edgeN[key]=(edgeN[key]||0)+1;const e=edgePath(from,p.to);
          let line=edges.querySelector(`[data-e="${key}"]`);
          if(!line){line=el("path",{d:e.d,fill:"none",stroke:"var(--agent)","stroke-linecap":"round","stroke-linejoin":"round","stroke-opacity":".8","data-e":key});edges.appendChild(line);}
          line.setAttribute("stroke-width",(2.6+1.2*edgeN[key]).toFixed(1));edges.querySelectorAll(".live").forEach(l=>l.classList.remove("live"));if(from!==p.to){line.classList.add("live");p.edge=line;}
          p.path=from===p.to?{loop:from}:{pts:e.pts};}
        else p.path={pts:gridRoute(START_CELL,CELL[p.to],[p.to])};
        svg.querySelectorAll(".hl").forEach(h=>h.setAttribute("stroke-width","0"));}
      // the floor plan: a line grows behind the robot; a wasteful step leaves a ring where it ended
      const rd=p.rd; bpulse.setAttribute("fill",rd.col);
      if(rd.move){p.line=el("polyline",{points:"",fill:"none",stroke:rd.col,"stroke-width":rd.kind?4.5:3,"stroke-linecap":"round","stroke-linejoin":"round","stroke-opacity":rd.kind?1:.8});
        if(rd.kind==="duplicate-fetch")p.line.setAttribute("stroke-dasharray","3 4");(rd.kind?stalls:trail).appendChild(p.line);}

        p.ring=el("circle",{cx:c[0],cy:c[1],r:0,fill:"none",stroke:rd.col,"stroke-width":3.5,"data-r":9+4*n});if(rd.kind==="duplicate-fetch")p.ring.setAttribute("stroke-dasharray","3 3");stalls.appendChild(p.ring);}

      const c=ctr(p.rd.to);bot.setAttribute("transform",`translate(${c[0].toFixed(1)} ${c[1].toFixed(1)})`);

  };

      else{const c=ctr(rd.from);pt=rd.kind?[c[0]+(Math.sin((now-pStart)/22)>0?7:-7),c[1]+(Math.random()-0.5)*6]:c;rot=rd.kind?(Math.sin((now-pStart)/34)>0?10:-10):0;if(ph.ring)ph.ring.setAttribute("r",(ph.ring.dataset.r*f).toFixed(1));}

    const pr=12+5*Math.sin(now/170), po=(.16+.1*Math.sin(now/170)).toFixed(3); [bpulse,fpulse].forEach(c=>{c.setAttribute("r",pr.toFixed(1));c.setAttribute("opacity",po);});

}
(async()=>{await load();if(DATA.length){const q=new URLSearchParams(location.search).get("i");if(q!=null)sel.value=q;start();}})();
