  #     `display: "summarized"` is what makes the thinking TEXT come back (empty otherwise).
  #     effort low..xhigh and max are all accepted through litellm 1.100.1.
  #   - tool_choice "any"/"tool" -> HTTP 400 (harnesses here use "auto"; tau2 verified).
  #   - temperature is accepted (200), so the harnesses' temperature=1.0 is not a blocker.
  #   - replaying the history WITHOUT its thinking blocks (tau2 drops them) returned 200 on
  #     this account, with and without prior thinking; keep an eye on it - the API docs
  #     reserve the right to 400 on edited history for newer accounts.
  #   - 1M context; prices $10 / $50 per M, cache read $0.25, cache write $12.5 (LiteLLM's
  #     live price map, which pricing.py fetches at proxy start).
  # =========================================================================
  - model_name: claude-fable-5-1
    litellm_params:
