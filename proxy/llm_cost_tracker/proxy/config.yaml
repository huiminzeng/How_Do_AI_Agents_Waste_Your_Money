  # GPT-5.6, with reasoning tokens recorded.
  #
  # **The `responses/` segment is load-bearing.** OpenAI refuses function tools together
  # with reasoning on /v1/chat/completions for this family — "Function tools with
  # reasoning_effort are not supported for gpt-5.6-terra in /v1/chat/completions" — and
  # every benchmark here is tool-driven. That prefix makes LiteLLM translate to
  # /v1/responses and translate the reply back, so the harness, this proxy and
  # trace_logger all keep speaking chat/completions. Verified: tool_calls arrive in
  # `choices[].message.tool_calls` and the reasoning count in
  # `completion_tokens_details.reasoning_tokens`, exactly where the logger reads them.
  #
  # `reasoning_effort` is pinned because the default is *none* on this route: without it
  # the model answers with zero reasoning tokens, which would silently produce a column
  # of zeros rather than an error. Measured on one tool call: none 0, medium 17, high 15.
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/responses/gpt-5.6-terra
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY
      reasoning: {"effort": "high", "summary": "auto"}
  # Effort-paired siblings for terra, and the gpt-5.6-sol tier. Same `openai/responses/`
  # route: verified that sol reports output_tokens_details.reasoning_tokens (61
  # on a probe) and that litellm translates it into the standard slot the logger reads.
  # sol is the pricier tier ($4/$20 vs terra's $2/$12).
  # `openai/`-prefixed twins. tau2 and mini-swe-agent call
  # litellm client-side, and litellm infers the provider from the model name: a bare
  # `claude-sonnet-5` would be routed straight to Anthropic, bypassing this proxy entirely
  # so no trace is ever written (the run looks fine — that is what makes it dangerous).
  # The prefix says "speak OpenAI chat-completions to api_base", which is the proxy.
  # Same trick as `openai/gemini-3.1-pro-preview`. Traces land under the resolved
  # model name, so the arms do not split.
  - model_name: openai/claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      # Cache markers: system + LAST message. See CACHE_CONTROL note at the top.
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
      thinking: {"type": "adaptive", "display": "summarized"}
      output_config: {"effort": "high"}
    model_info:
      max_input_tokens: 200000
  - model_name: openai/claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
      # Cache markers: system + LAST message. See CACHE_CONTROL note at the top.
