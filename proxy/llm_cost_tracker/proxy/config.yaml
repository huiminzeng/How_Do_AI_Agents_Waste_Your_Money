      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: high
  # Effort-paired aliases for a future sweep, same pattern as the claude-opus-5 trio.
  # NOT a substitute for the plain alias: measured, the unset default sits near high (reasoning 754 unset / 834 high / 378 low on one prompt),
  # so adding an explicit effort would silently change the arm being compared. Use these
  # only when the sweep is the point, and the trace's `model` field will name the arm.
  - model_name: gemini-3.1-pro-high
