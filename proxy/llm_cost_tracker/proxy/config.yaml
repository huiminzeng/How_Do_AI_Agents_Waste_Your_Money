  # --- Kimi K3 via an OpenAI-compatible gateway (KIMI_BASE_URL).
  #
  #     effort=max goes in extra_body, NOT as a plain `reasoning_effort:`. Measured on
  #     a litellm proxy: a config-level reasoning_effort looks connected
  #     but is dropped before the upstream call (no-param calls hit the server default,
  #     28 reasoning tokens x3). extra_body is merged verbatim into every request body.
  #     It does NOT override a client-sent reasoning_effort: measured on both
  #     litellm 1.81.11 and 1.100.1, a client value replaces it in the outbound body. The
  #     same holds for gemini and the Responses route; only Anthropic's alias-level
  #     output_config beats the client. Harnesses must therefore send no effort param and
  #     select the level by alias; every row's `request_params` records what went out.
  #     allowed_openai_params is required too: litellm's validation does not know
  #     kimi-k3 is a reasoning model and rejects the param without the whitelist.
  #
  #     temperature and max_tokens are deliberately NOT here: the harness sets them
  #     per run, so every row's request_params records what it asked for.
  # --- Gemini 3.1 Pro. The OpenAI-compatible shim is the other route to this model,
  #     and that route does NOT report reasoning tokens: measured, the
  #     /v1beta/openai endpoint returned completion_tokens 1 against total_tokens 130 —
  #     121 tokens of thinking happened and no field carried the count. The native
  #     `gemini/` route surfaces Gemini's thoughtsTokenCount as
  #     completion_tokens_details.reasoning_tokens (measured: 186, with text_tokens 38
  #     making up the rest of completion_tokens 224); token counts and prices are the
  #     same on both routes.
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
      # Explicit on purpose: every gemini alias names its thinking level (this one
      # high, -low/-high below) and no run depends on what a given litellm does when
      # the field is absent (1.100.1 sends no thinkingConfig at all; 1.81.11 injected
      # thinkingLevel=low, so numbers from the two versions are NOT comparable).
      # `request_params.outbound.generationConfig.thinkingConfig` records the level per row.
      reasoning_effort: high
