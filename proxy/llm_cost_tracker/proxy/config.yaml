      model: openai/kimi-k3
      api_base: os.environ/KIMI_BASE_URL
      api_key: os.environ/KIMI_API_KEY
      extra_body: {"reasoning_effort": "high"}
      allowed_openai_params: ["reasoning_effort"]
    model_info:
      max_input_tokens: 1048576
  # Same target, NO extra_body - for clients that speak the Anthropic wire.
  # claudecode (Claude Code) posts /v1/messages and nothing else. The gateway's Anthropic
  # route rejects `reasoning_effort` outright, so every alias above 400s on every call
  # from it ("unsupported parameter(s): `reasoning_effort`"). Without extra_body the same
  # request succeeds - verified on a throwaway proxy.
  #
  # Effort CANNOT be pinned on this alias, and that is a property of the route, not an
  # oversight: kimi's effort knob does not exist on the Anthropic wire, and the Anthropic
  # spelling `thinking: {type: enabled, effort: ...}` is ACCEPTED there and does nothing
  # (none/low/high/max all returned the same reasoning length, ranges fully overlapping,
  # while the same four arms separate 542/1282/1541 on chat/completions). Anything run on
  # this alias runs at the gateway default and must be reported that way.
  - model_name: kimi-k3-anthropic
    litellm_params:
      model: openai/kimi-k3
      api_base: os.environ/KIMI_BASE_URL
      api_key: os.environ/KIMI_API_KEY
    model_info:
      max_input_tokens: 1048576

