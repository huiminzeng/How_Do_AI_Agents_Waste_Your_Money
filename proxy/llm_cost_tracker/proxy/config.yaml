# CACHE_CONTROL — every Anthropic entry marks the LAST message (`index: -1`).
#
# On litellm 1.100.1 `role: user` marks EVERY user message, Anthropic caps a request at
# 4 breakpoints, and during a tool-call streak the last marked message is an old user
# turn, so the streak's new content is re-billed uncached every round (measured on a
# fable tau2 smoke: uncached input 0% -> 34% of the prompt by round 12, cache writes
# stopped, "Reached the provider limit of 4 cache breakpoints" in the log).
# `index: -1` marks whatever the last message is; the tool_result problem that would
# otherwise force `role: user` is fixed in litellm_patches.ANTHROPIC_TOOL_MESSAGE_MARKER (the
# marker goes on the tool_result block, where Anthropic wants it). Two breakpoints per
# request (system + last message), never near the cap.
#
# --- history of the role:user period ---
#
# `index: -1` means "the last message, whatever it is", and litellm's injection
# hook writes the marker INTO that message's content. Where it lands depends on
# the content's shape, which differs per harness:
#
#   tau2            tool message content is a plain string -> the marker goes on
#                   the message itself. Works; measured 100% cache hit across
#                   3,981 claude-sonnet-5 calls.
#   mini-swe-agent  tool message content is a LIST of blocks -> the marker goes
#                   inside content[0], and Anthropic rejects the request:
#                   "cache_control may not be specified within
#                   tool_result.content. Instead, place it directly on
#                   tool_result." Every SWE-bench trajectory would die at round 2.
#
# `role: user` sidesteps the shape question entirely: a user message is a
# message, never a tool_result, on either harness. Anthropic caches by PREFIX, so
# a marker on the last user message still covers every earlier turn, tool results
# included.
#
# What this changes for the finished cells: on tau2, 42% of calls end in a tool
# result, and on those the marker now sits one message earlier. The cached PREFIX
# is the same content either way, and that cell already measured 100% hit — so
# this is where the marker goes, not what gets cached.
#
# REASONING TEXT — every Anthropic alias sends
#   thinking: {"type": "adaptive", "display": "summarized"}
# and every OpenAI Responses alias sends reasoning: {"effort": ..., "summary": "auto"}.
# Both are display-only: thinking happens and is billed identically under every
# setting (Anthropic), and the summary carries no token charge (OpenAI). Without them
# a run records reasoning COUNTS for claude-sonnet-5 and gpt-5.6-terra but not one
# character of reasoning text (Anthropic returns thinking blocks with an
# empty string by default on 4.7+/5.x; OpenAI omits the summary unless asked).
# Do NOT combine `reasoning_effort:` with `extra_body: {"reasoning": {...}}` on the
# Responses route: the extra_body dict replaces the whole `reasoning` object and the
# effort silently falls back to the provider default (measured: high -> medium).
#
# LiteLLM proxy config for LLM cost monitoring.
#
# Start with:
#   proxy/setup.sh once, then ./run_proxy.sh from the repository root
#
# Point any OpenAI-compatible client at this proxy:
#   export OPENAI_BASE_URL=http://localhost:4000/v1
#   export OPENAI_API_KEY="$PROXY_API_KEY"     # the master_key below, from the repository root .env
#
# All calls are routed through the proxy, logged by trace_logger.py,
# and prompt caching is auto-injected for supported models.

model_list:
  # =========================================================================
  # OpenAI GPT models (first-party API)
  # Pricing source: https://openai.com/api/pricing/
  #
  # api_base is pinned on EVERY entry on purpose. LiteLLM's OpenAI provider falls
  # back to $OPENAI_BASE_URL when api_base is unset, and this proxy's own process
  # inherits OPENAI_BASE_URL=http://localhost:4000/v1 from .env — which would make
  # the proxy call itself in a loop. Do not remove these api_base lines.
  # =========================================================================
  - model_name: gpt-5-chat
    litellm_params:
      model: openai/gpt-5-chat
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY


  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY

  # First-party equivalent of the old azure/gpt-5.2-chat deployment.
  - model_name: gpt-5.2-chat
    litellm_params:
      model: openai/gpt-5.2-chat-latest
      base_model: gpt-5.2-chat-latest
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY

  # LiteLLM client aliases (tau2 uses openai/... with OPENAI_BASE_URL proxy).
  - model_name: openai/gpt-5-chat
